# The queue's Valkey for BullMQ, configured as in the cluster (lab-gitops).
dir /data
# AOF: at most the last second of writes is lost if the machine stops abruptly.
appendonly yes
appendfsync everysec
# noeviction: when full, Valkey rejects writes instead of deleting queued jobs.
maxmemory 128mb
maxmemory-policy noeviction
# The password lives in its own file, never on the command line.
include /etc/valkey/auth.conf
