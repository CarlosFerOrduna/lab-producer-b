# The cache's Valkey, configured as in the cluster (lab-gitops).
# No persistence: a restart starts empty, and the service reads from the database.
appendonly no
save ""
# allkeys-lru: when full, Valkey evicts the least recently used keys.
maxmemory 64mb
maxmemory-policy allkeys-lru
# The password lives in its own file, never on the command line.
include /etc/valkey/auth.conf
